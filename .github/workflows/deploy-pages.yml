name: Deploy Angular to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.19.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run application tests
        run: npm test -- --watch=false

      - name: Test theme initialization
        run: node --test --test-isolation=none scripts/theme-init.test.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build production application
        run: npm run build -- --configuration production --base-href /rochi.entrena/

      - name: Upload browser application
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/rochy-hub/browser

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
