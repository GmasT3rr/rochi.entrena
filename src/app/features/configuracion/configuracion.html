<app-page-header
  title="Configuración"
  subtitle="Preferencias generales del panel. En esta etapa se muestran solo valores de referencia."
/>

<section class="settings" aria-label="Ajustes generales">
  @for (ajuste of ajustes; track ajuste.titulo) {
    <mat-card appearance="outlined" class="setting">
      <mat-card-header>
        <mat-card-title>{{ ajuste.titulo }}</mat-card-title>
        <mat-card-subtitle>{{ ajuste.detalle }}</mat-card-subtitle>
      </mat-card-header>
      <mat-card-content>
        <p>{{ ajuste.descripcion }}</p>
      </mat-card-content>
    </mat-card>
  }
</section>
