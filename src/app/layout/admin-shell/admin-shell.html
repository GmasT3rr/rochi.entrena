<a class="skip-link" href="#contenido-principal">Saltar al contenido</a>

<mat-sidenav-container class="shell">
  <mat-sidenav
    class="sidebar"
    [mode]="sidenavMode()"
    [opened]="sidenavOpened()"
    [fixedInViewport]="true"
    (openedChange)="onOpenedChange($event)"
    role="navigation"
    aria-label="Navegación principal"
  >
    <div class="brand">
      <span class="brand__mark" aria-hidden="true">RH</span>
      <div class="brand__text">
        <strong>Rochy</strong>
        <span>Panel administrativo</span>
      </div>
    </div>

    <mat-nav-list class="nav">
      @for (item of navItems; track item.path) {
        <a
          mat-list-item
          [routerLink]="item.path"
          routerLinkActive="nav-item--active"
          (click)="closeIfMobile()"
        >
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.label }}</span>
        </a>
      }
    </mat-nav-list>

    <div class="sidebar__footer">
      <mat-divider />
      <p>Espacio de trabajo de Rochy</p>
    </div>
  </mat-sidenav>

  <mat-sidenav-content class="content">
    <mat-toolbar class="topbar">
      @if (isMobile()) {
        <button
          matIconButton
          type="button"
          class="topbar__menu"
          aria-label="Abrir menú de navegación"
          (click)="toggleSidenav()"
        >
          <mat-icon>menu</mat-icon>
        </button>
      }

      <h1 class="topbar__title">{{ pageTitle() }}</h1>

      <span class="topbar__spacer"></span>

      <div class="user" aria-label="Usuario actual">
        <span class="user__avatar" aria-hidden="true">R</span>
        <span class="user__name">Rochy</span>
      </div>
    </mat-toolbar>

    <main id="contenido-principal" class="main" tabindex="-1">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
