<article class="card" [class.card--compact]="compact()">
  <div class="card__icon" aria-hidden="true">
    <mat-icon>{{ icon() }}</mat-icon>
  </div>
  <p class="card__label">{{ label() }}</p>
  <p class="card__value">{{ value() }}</p>
  @if (hint()) {
    <p class="card__hint">{{ hint() }}</p>
  }
  @if (enlace()) {
    <a
      class="card__link"
      [routerLink]="enlace()"
      [queryParams]="parametros()"
      [attr.aria-label]="'Ver detalle: ' + label()"
      >Ver detalle <span aria-hidden="true">→</span></a
    >
  }
</article>
